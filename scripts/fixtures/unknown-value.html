<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unknown value | controlled fixture</title>
<link rel="stylesheet" href="_fixture.css">
</head>
<body>
<div class="fixture-banner">Controlled recorded state | fixture unknown-value</div>
<div class="fixture-app">
  <div class="panel" style="max-width:520px">
    <div class="panel-head"><span>Market row</span><span class="chip unknown">Sources</span></div>
    <div class="panel-body">
      <div class="row"><span class="k">Token</span><span class="v">DEMO (SRC-20)</span></div>
      <div class="row"><span class="k">Floor price</span><span class="v">&mdash;</span></div>
      <div class="row"><span class="k">24h volume</span><span class="v">&mdash;</span></div>
      <div class="row"><span class="k">Holders</span><span class="v">1,204</span></div>
      <div class="row"><span class="k">Identity source</span><span class="v chip unknown">none</span></div>
      <div class="row"><span class="k">Price source</span><span class="v chip unknown">none</span></div>
      <div class="custody">A dash means the venue has no number it can prove, not that the value is zero. Sources are shown per figure.</div>
    </div>
  </div>
</div>
</body>
</html>
