name: Docs quality

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: runs-on=${{ github.run_id }}-check/runner=universe-hosted/cpu=2+8/env=production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@e2a4530be8c5d42e23ed7c198300d05d775ddeb0 # v1
      - name: Runner policy
        run: node scripts/check-runners.mjs

      - name: Text and link checks
        run: node scripts/check-docs.mjs
