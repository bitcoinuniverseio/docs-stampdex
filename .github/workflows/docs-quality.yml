name: Docs quality

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: runs-on=${{ github.run_id }}-check/runner=universe-hosted/cpu=2+8/env=production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@8e24bc760556caa5ec8c7c497baaad2e9adcc912 # v1 # v1
      - name: Runner policy
        run: node scripts/check-runners.mjs

      - name: Text and link checks
        run: node scripts/check-docs.mjs
