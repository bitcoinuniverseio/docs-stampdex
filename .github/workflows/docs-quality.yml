name: Docs quality

on:
  push:
    branches: ["codex/**"]
  # The persistent fleet admits trusted push and dispatch jobs, not PR events.
  workflow_dispatch:
    inputs:
      artifact_tag:
        description: 'Optional site artifact from an earlier passing check of this tree'
        type: string
        default: ''
      artifact_sha256:
        description: 'SHA256 of that exact checked artifact'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: docs-quality-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # This repository is public, so pull request jobs run through the shared
    # capacity router. A fork pull request must not reach organisation-owned
    # infrastructure.
    runs-on: [self-hosted, universe-runners-1]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      ARTIFACT_TAG: ${{ inputs.artifact_tag || vars.DOCS_VERIFIED_ARTIFACT_TAG }}
      ARTIFACT_SHA256: ${{ inputs.artifact_sha256 || vars.DOCS_VERIFIED_ARTIFACT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: bitcoinuniverseio/universe-ci-actions/universe-host-tools@c9bb29ab2b39ea95dcc430fda80416deb2c4eb85
      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@8e24bc760556caa5ec8c7c497baaad2e9adcc912 # v1

        with:
          install: ${{ env.ARTIFACT_TAG == '' }}

      - name: Reuse checked source and site
        if: env.ARTIFACT_TAG != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/restore-verified-build.mjs "$ARTIFACT_TAG" "$ARTIFACT_SHA256"

      - name: Runner policy
        run: node scripts/check-runners.mjs && node --test scripts/fork-isolation.test.mjs

      - name: Copy guard (long dash, banned word, marketing phrases, relative links)
        if: env.ARTIFACT_TAG == ''
        run: npm run check:copy

      - name: Bilingual parity and glossary compliance
        if: env.ARTIFACT_TAG == ''
        run: npm run check:translations

      - name: Colour contrast meets WCAG 2.2 AA in both themes
        if: env.ARTIFACT_TAG == ''
        run: npm run check:contrast

      - name: Documentation manifest is valid
        if: env.ARTIFACT_TAG == ''
        run: npm run check:manifest

      - name: Screenshot manifest, freshness, variants, and secret scan
        if: env.ARTIFACT_TAG == ''
        run: npm run check:screens

      - name: Install Playwright browsers
        if: env.ARTIFACT_TAG == ''
        run: npx playwright install --only-shell chromium

      - name: Build
        if: env.ARTIFACT_TAG == ''
        run: npm run build

      - name: Visual regression against the committed baselines
        if: env.ARTIFACT_TAG == ''
        run: npm run check:visual

      - name: MCP tool contract tests
        if: env.ARTIFACT_TAG == ''
        run: npm run test:mcp

      - name: Release status checks
        if: env.ARTIFACT_TAG == ''
        run: node --test scripts/release-status.test.mjs

      - name: Internal links and anchors
        if: env.ARTIFACT_TAG == ''
        run: npm run check:links

      - name: Page metadata (one h1, skip link, descriptions, Open Graph, alt text)
        if: env.ARTIFACT_TAG == ''
        run: npm run check:metadata

      - name: Nothing unbreakable that would push a 320px screen sideways
        if: env.ARTIFACT_TAG == ''
        run: npm run check:overflow

      - name: Search index exists
        if: env.ARTIFACT_TAG == ''
        run: test -f dist/pagefind/pagefind.js

      - name: Sitemap exists
        if: env.ARTIFACT_TAG == ''
        run: test -f dist/sitemap-index.xml

      - name: Machine-readable index exists
        if: env.ARTIFACT_TAG == ''
        run: test -s dist/llms.txt

      - name: No image over 200 KB
        if: env.ARTIFACT_TAG == ''
        run: |
          oversized=$(find dist -type f \( -name '*.png' -o -name '*.webp' -o -name '*.jpg' \) -size +200k)
          if [ -n "$oversized" ]; then
            echo "Over the 200 KB image budget:"
            echo "$oversized"
            exit 1
          fi
          echo "Every image is within budget."

      - name: Package the checked site for publishing
        if: env.ARTIFACT_TAG == ''
        run: node scripts/package-verified-build.mjs

      - name: Save the checked site
        if: env.ARTIFACT_TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: verified-site
          path: verified-site.tar.gz
          retention-days: 14
          if-no-files-found: error

      - name: Upload visual baselines for review and commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-${{ github.run_id }}
          path: tests/visual-baselines/
          retention-days: 14
          if-no-files-found: ignore
