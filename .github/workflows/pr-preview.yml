name: PR preview

# Downloadable, no-indexed builds for same-repository pull requests.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, universe-super]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@8e24bc760556caa5ec8c7c497baaad2e9adcc912
        if: github.event.action != 'closed'

      - name: Install
        if: github.event.action != 'closed'
        run: npm ci

      - name: Build
        if: github.event.action != 'closed'
        run: npm run build

      - name: Mark the preview noindex and banner it
        if: github.event.action != 'closed'
        run: |
          for f in $(find dist -name '*.html'); do
            sed -i 's|</title>|</title><meta name="robots" content="noindex">|' "$f"
            sed -i 's|<body|<body data-pr-preview="true"|' "$f"
          done
          cat > dist/preview.html <<HTML
          <!doctype html><meta charset="utf-8"><title>Preview ${GITHUB_REF_NAME}</title>
          <p style="font:700 16px sans-serif;padding:1rem;background:#2e2110;color:#f5ce8f">
            Pull request preview ${GITHUB_REF_NAME}. Not production. <a href="/docs-stampdex/">Back to production</a>.
          </p>
          HTML

      - name: Upload the preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-pr-${{ github.event.pull_request.number }}
          path: dist/
          retention-days: 7
