name: pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: [self-hosted, linux, x64, universe-super]
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@8e24bc760556caa5ec8c7c497baaad2e9adcc912 # v1

      - name: Runner policy
        run: node scripts/check-runners.mjs

      - name: Install
        run: npm ci

      - name: Gates that must hold on the deployed commit
        run: npm test

      - name: Build
        run: npm run build

      - name: Internal links, page metadata, and mobile reflow
        run: npm run check:site

      - name: Mark the output as not-Jekyll
        run: touch dist/.nojekyll

      - name: Upload the checked site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
