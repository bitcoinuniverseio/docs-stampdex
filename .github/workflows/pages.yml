name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # The RunsOn artifact proxy returns a plain-text endpoint marker to
    # actions/upload-artifact, which makes the Pages upload fail after a
    # successful build. This workflow runs only for trusted main pushes or a
    # maintainer dispatch, so the organisation-owned Linux fleet is safe here.
    runs-on: [self-hosted, Linux, linux-ultra]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Runner policy
        run: node scripts/check-runners.mjs

      - name: Install
        run: npm ci

      - name: Gates that must hold on the deployed commit
        run: npm test

      - name: Build
        run: npm run build

      - name: Internal links and anchors
        run: npm run check:links

      - name: Page metadata (one h1, skip link, descriptions, Open Graph, alt text)
        run: npm run check:metadata

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, linux-ultra]
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
