name: pages

on:
  workflow_dispatch:
    inputs:
      artifact_tag:
        description: 'Optional checked site artifact tag'
        type: string
        default: ''
      artifact_sha256:
        description: 'SHA256 of that exact artifact'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, universe-runners-1]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: bitcoinuniverseio/universe-ci-actions/universe-host-tools@ca7d5a2893fd27f41c26f6b62549ccad8b3c46cb
      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@8e24bc760556caa5ec8c7c497baaad2e9adcc912 # v1
        with:
          install: ${{ inputs.artifact_tag == '' }}

      - name: Runner policy
        run: node scripts/check-runners.mjs

      - name: Gates that must hold on the deployed commit
        if: inputs.artifact_tag == ''
        run: npm test

      - name: Build
        if: inputs.artifact_tag == ''
        run: npm run build

      - name: Internal links, page metadata, and mobile reflow
        if: inputs.artifact_tag == ''
        run: npm run check:site

      - name: Reuse the checked immutable site
        if: inputs.artifact_tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_TAG: ${{ inputs.artifact_tag }}
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
        run: node scripts/restore-verified-build.mjs "$ARTIFACT_TAG" "$ARTIFACT_SHA256"

      - name: Mark the output as not-Jekyll
        run: touch dist/.nojekyll

      - name: Publish to the gh-pages branch
        # Branch publishing keeps the site out of Actions artifact storage,
        # which the Free plan shares with private packages and is full.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "Publish ${GITHUB_SHA}"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" push -qf "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
