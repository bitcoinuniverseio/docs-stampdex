name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    # Routed through the shared capacity router rather than the self-hosted
    # fleet. The organisation-owned Linux runners do not pick up jobs for this
    # repository, and the RunsOn artifact proxy returns a plain-text endpoint
    # marker to actions/upload-artifact, which breaks the Pages artifact
    # upload. Publishing to a branch avoids both problems: it needs no
    # artifact upload and no particular runner.
    runs-on: runs-on=${{ github.run_id }}-pages/runner=universe-hosted/cpu=2+8/env=production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Runner policy
        run: node scripts/check-runners.mjs

      - name: Install
        run: npm ci

      - name: Gates that must hold on the deployed commit
        run: npm test

      - name: Build
        run: npm run build

      - name: Internal links, page metadata, and mobile reflow
        run: npm run check:site

      # GitHub Pages serves this branch directly. Without .nojekyll it would
      # run Jekyll over the output, and Jekyll drops directories whose names
      # begin with an underscore, which is where Astro puts its assets.
      - name: Mark the output as not-Jekyll
        run: touch dist/.nojekyll

      - name: Publish to the gh-pages branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd dist
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA} from ${GITHUB_REF_NAME}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
